name: Compatibility report
description: Report a tested PPK2 firmware / OS / Python combination for the hardware compatibility matrix (works or fails).
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: |
        Compatibility reports fill the hardware matrix in
        [ROADMAP.md](https://github.com/tipoLi5890/ppk2lab/blob/main/ROADMAP.md) and are
        release gates for `0.2.0`. Both success and failure reports are valuable.

  - type: input
    id: version
    attributes:
      label: ppk2lab version
      description: Output of `ppk2lab --version`.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS and Python version
      placeholder: Ubuntu 24.04 / Python 3.12.4
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: PPK2 firmware version
      description: As reported by Nordic's official tools, if known.
      placeholder: 1.2.4
    validations:
      required: true

  - type: checkboxes
    id: tested
    attributes:
      label: What did you test?
      options:
        - label: discover / info (device found, measurement port identified, metadata parsed)
        - label: doctor --stream-check (100 kS/s rate, gap-free streaming)
        - label: capture to a .ppk2a artifact
        - label: configure --apply (mode / source voltage / DUT power)
        - label: UART decoding on real signals
        - label: SPI decoding on real signals
        - label: long capture (> 10 minutes)
        - label: multiple PPK2 devices at once
        - label: hot unplug during capture

  - type: dropdown
    id: outcome
    attributes:
      label: Overall outcome
      options:
        - everything I tested worked
        - partial (some items failed — details below)
        - mostly failing
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: ppk2lab doctor --json output
      render: json
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Details
      description: For any failure — the exact command, full output, and gap/error information. For successes, anything notable (gap counts on long captures, port naming quirks, etc.).
    validations:
      required: false
