name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Every version here is also advertised as a classifier in
        # pyproject.toml; the two lists must stay in step, or the package
        # claims support that nothing measures.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # `dev` pulls in `web` itself, but naming it is where a reader looks:
        # without it mypy types every Starlette symbol as Any and the server
        # tests would skip -- a suite that reports green while proving nothing
        # about half the release.
        run: pip install -e ".[dev,web]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Type check
        run: mypy
      - name: Unit tests (no hardware)
        run: pytest
      - name: CLI smoke (simulated device)
        shell: bash
        run: |
          ppk2lab --version
          ppk2lab --simulate doctor --json > /dev/null
          ppk2lab capabilities --json > /dev/null
          ppk2lab schema envelope > /dev/null
          ppk2lab --simulate capture --duration 200ms --output smoke.ppk2a --json > /dev/null
          ppk2lab decode smoke.ppk2a --uart D0 --baud 9600 --output smoke.jsonl --json > /dev/null
          ppk2lab assert smoke.ppk2a --rule "max_current < 1A" --json > /dev/null
      - name: Web console smoke (simulated device, viewer only)
        shell: bash
        timeout-minutes: 5
        # One inline Python block rather than a backgrounded shell job: kill and
        # SIGINT semantics differ under Git-Bash on windows-latest, and a stray
        # orphan would hang the runner.
        run: |
          python - <<'PY'
          import json, os, signal, subprocess, sys, urllib.request

          flags = {"creationflags": subprocess.CREATE_NEW_PROCESS_GROUP} if os.name == "nt" else {}
          proc = subprocess.Popen(
              [sys.executable, "-m", "ppk2lab.cli.main", "--json", "--simulate",
               "web", "--http-port", "0"],
              stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, **flags)
          try:
              ready = None
              for line in proc.stderr:
                  if line.startswith("ppk2lab-web-ready "):
                      ready = json.loads(line.split(" ", 1)[1])
                      break
              if ready is None:
                  raise SystemExit("the server never announced a bound port")
              assert ready["port"] != 0, "--http-port 0 did not report a real port"

              with urllib.request.urlopen(ready["url"], timeout=10) as response:
                  body = response.read()
              assert response.status == 200 and b"app.js" in body, "the console was not served"

              # Windows: uvicorn's HANDLED_SIGNALS includes SIGBREAK there.
              sig = signal.CTRL_BREAK_EVENT if os.name == "nt" else signal.SIGINT
              proc.send_signal(sig)
              assert proc.wait(timeout=30) == 0, "a clean shutdown did not exit 0"
              envelope = json.loads(proc.stdout.read())
              assert envelope["ok"], envelope
              assert envelope["result"]["control_enabled"] is False
              assert envelope["result"]["simulated"] is True
          finally:
              if proc.poll() is None:
                  proc.kill()
                  proc.wait(timeout=10)
          PY
      - name: Examples (simulated device)
        shell: bash
        run: |
          for example in examples/*.py; do
            echo "--- $example"
            python "$example" --simulate > /dev/null
          done

  webui:
    # src/ppk2lab_web/static/ is a build artifact that is committed and shipped.
    # Nothing at install time rebuilds it, so without this job a stale bundle
    # reaches PyPI with pytest, ruff and mypy all green.
    name: frontend (typecheck, tests, build in sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: webui/.nvmrc
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install
        run: npm ci
        working-directory: webui
      - name: Type check
        run: npm run typecheck
        working-directory: webui
      - name: Unit tests
        run: npm test
        working-directory: webui
      - name: Rebuild
        run: npm run build
        working-directory: webui
      - name: The committed build must match its sources
        # --porcelain rather than `git diff --exit-code`: it also catches a
        # file the bundler deleted or newly created, which a diff would miss.
        run: |
          if [ -n "$(git status --porcelain -- src/ppk2lab_web/static)" ]; then
            echo "::error::src/ppk2lab_web/static is out of date; run 'cd webui && npm run build' and commit the result"
            git status --porcelain -- src/ppk2lab_web/static
            git diff --stat -- src/ppk2lab_web/static
            exit 1
          fi

  build:
    name: build sdist/wheel + fresh-venv smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Fresh-venv install smoke test
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/ppk2lab --version
          PPK2LAB_SIMULATE=1 /tmp/fresh/bin/ppk2lab doctor --json > /dev/null
      - name: A base install is still pyserial and nothing else
        # Asserted from the artifact that would be uploaded, not from
        # pyproject.toml: this is the promise a `pip install ppk2lab` makes,
        # and it cannot be fixed after an upload.
        run: |
          /tmp/fresh/bin/python -c "
          from importlib.metadata import metadata
          m = metadata('ppk2lab')
          base = [r for r in (m.get_all('Requires-Dist') or []) if 'extra ==' not in r]
          assert base == ['pyserial>=3.5'], base
          assert sorted(m.get_all('Provides-Extra') or []) == ['dev', 'web'], m.get_all('Provides-Extra')
          import sys, ppk2lab
          assert 'starlette' not in sys.modules, 'importing ppk2lab pulled in the web extra'
          "
      - name: '`ppk2lab web` exists without its extra and says what is missing'
        # The highest-value check here: from the wheel that actually ships, the
        # subcommand is present in a base install, exits 7, and names the
        # remedy -- so `--help` and `capabilities` are honest whatever is
        # installed.
        shell: bash
        run: |
          set +e
          /tmp/fresh/bin/ppk2lab --json web > web-missing.json
          code=$?
          set -e
          test "$code" = "7" || { echo "::error::expected exit 7, got $code"; cat web-missing.json; exit 1; }
          grep -q '"WEB_EXTRA_MISSING"' web-missing.json
          grep -q "ppk2lab\[web\]" web-missing.json
      - name: Installed wheel carries the web console
        run: |
          python -c "
          import glob, zipfile
          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          for asset in ('index.html', 'app.js', 'app.css'):
              path = 'ppk2lab_web/static/' + asset
              assert path in names, 'wheel omits ' + path
          assert 'ppk2lab_web/py.typed' in names, 'PEP 561 marker missing for ppk2lab_web'
          "
      - name: Installed wheel is typed and correctly licensed
        # These have to be checked against the installed package, not the
        # source tree: py.typed exists in src/ whether or not packaging puts
        # it in the wheel, and a source-tree check would pass either way.
        # Without the marker, PEP 561 makes every downstream type checker
        # treat the whole ppk2lab surface as Any.
        run: |
          /tmp/fresh/bin/python -c "
          import pathlib
          from importlib.metadata import metadata
          import ppk2lab
          marker = pathlib.Path(ppk2lab.__file__).parent / 'py.typed'
          assert marker.is_file(), 'PEP 561 marker missing from the installed package: ' + str(marker)
          m = metadata('ppk2lab')
          assert m['License-Expression'] == 'MIT', 'License-Expression is ' + repr(m['License-Expression'])
          files = sorted(m.get_all('License-File') or [])
          assert files == ['LICENSE', 'NOTICE.md'], 'License-File lines: ' + repr(files)
          "
      - name: Sdist carries the legal and reference files
        # NOTICE.md ships as a License-File and points at docs/sources.md, so
        # the docs have to travel with it; THIRD_PARTY_NOTICES.md is the
        # license audit the release checklist reconciles against.
        run: |
          for path in CHANGELOG.md THIRD_PARTY_NOTICES.md docs/sources.md examples tests; do
            tar tzf dist/*.tar.gz | grep -q "/$path" || {
              echo "::error::$path is missing from the sdist; check MANIFEST.in"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

# The release gates in ROADMAP.md need a physical PPK2 and an MCU fixture, so
# they are run by the maintainer on the bench rather than produced by a
# workflow here. ROADMAP.md's compatibility matrix records what was covered.
