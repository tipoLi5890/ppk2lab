name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Type check
        run: mypy
      - name: Unit tests (no hardware)
        run: pytest
      - name: CLI smoke (simulated device)
        shell: bash
        run: |
          ppk2lab --version
          ppk2lab --simulate doctor --json > /dev/null
          ppk2lab capabilities --json > /dev/null
          ppk2lab schema envelope > /dev/null
          ppk2lab --simulate capture --duration 200ms --output smoke.ppk2a --json > /dev/null
          ppk2lab decode smoke.ppk2a --uart D0 --baud 9600 --output smoke.jsonl --json > /dev/null
          ppk2lab assert smoke.ppk2a --rule "max_current < 1A" --json > /dev/null

  build:
    name: build sdist/wheel + fresh-venv smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Fresh-venv install smoke test
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/ppk2lab --version
          PPK2LAB_SIMULATE=1 /tmp/fresh/bin/ppk2lab doctor --json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

# A separate hardware workflow (self-hosted runner with a PPK2 and MCU
# fixture) covers the release gates in ROADMAP.md; it is intentionally not
# part of the default PR matrix.
