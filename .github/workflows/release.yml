name: Release

# Publishing uses PyPI Trusted Publishing (OIDC): no API tokens are stored
# in the repository. PyPI trusts this exact workflow file, in this exact
# repository, running in the named GitHub environment.
#
# - Manual run (workflow_dispatch)  -> publishes to TestPyPI (rehearsal)
# - Publishing a GitHub Release     -> publishes to PyPI (the real thing)

on:
  release:
    types: [published]
  workflow_dispatch: # rehearsal: builds and uploads to TestPyPI only

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches the package version (release only)
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(python -c "import pathlib,re; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/ppk2lab/_version.py').read_text()).group(1))")
          TAG="${{ github.event.release.tag_name }}"
          echo "package=$PKG_VERSION tag=$TAG"
          test "v$PKG_VERSION" = "$TAG" || { echo "::error::tag $TAG does not match package version $PKG_VERSION"; exit 1; }
      - run: pip install build
      - run: python -m build
      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI (rehearsal)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ppk2lab
    permissions:
      id-token: write # OIDC token for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ppk2lab
    permissions:
      id-token: write # OIDC token for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
