name: Release

# Publishing uses PyPI Trusted Publishing (OIDC): no API tokens are stored
# in the repository. PyPI trusts this exact workflow file, in this exact
# repository, running in the "pypi" GitHub environment. Publishing a GitHub
# Release triggers the upload; the environment's required-reviewer rule
# adds a manual approval step before anything reaches PyPI.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches the package version
        run: |
          PKG_VERSION=$(python -c "import pathlib,re; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/ppk2lab/_version.py').read_text()).group(1))")
          TAG="${{ github.event.release.tag_name }}"
          echo "package=$PKG_VERSION tag=$TAG"
          test "v$PKG_VERSION" = "$TAG" || { echo "::error::tag $TAG does not match package version $PKG_VERSION"; exit 1; }
      - run: pip install build
      - run: python -m build
      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*
      - name: Check the artifacts that will actually be uploaded
        # This job builds its own dist/, so the CI build job's checks do not
        # cover it. A wheel published without py.typed silently disables type
        # checking for every downstream consumer, and PyPI records the license
        # from this metadata — neither is fixable after an upload.
        run: |
          python -c "
          import glob, zipfile
          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert 'ppk2lab/py.typed' in names, 'PEP 561 marker missing from ' + wheel
          info = [n for n in names if n.endswith('.dist-info/METADATA')][0]
          meta = zipfile.ZipFile(wheel).read(info).decode()
          assert 'License-Expression: MIT' in meta, 'wheel does not declare License-Expression: MIT'
          for name in ('LICENSE', 'NOTICE.md'):
              assert 'License-File: ' + name in meta, 'wheel omits License-File: ' + name
          "
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ppk2lab
    permissions:
      id-token: write # OIDC token for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
