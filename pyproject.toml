[build-system]
# >=77 is required by the PEP 639 SPDX `license` field below; on older
# setuptools that field is rejected rather than ignored.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ppk2lab"
description = "Control, capture, decode, and test Nordic Semiconductor Power Profiler Kit II hardware from Python, CLI automation, CI, and AI agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.11"
authors = [{ name = "ppk2lab contributors" }]
keywords = ["ppk2", "power-profiler", "nordic", "logic-analyzer", "uart", "spi", "energy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Embedded Systems",
  "Topic :: System :: Hardware",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
# The server half. Nothing in `ppk2lab` imports any of these, and a plain
# `pip install ppk2lab` still resolves to pyserial and nothing else; `ppk2lab
# web` exists without them and exits 7 saying which one is missing.
#
# Deliberately NOT `uvicorn[standard]`. That pulls in httptools, uvloop and
# watchfiles, none of which publishes a pure-Python or abi3 wheel: uvloop has
# no Windows wheel at all, and this project's matrix is three operating systems
# by four Python versions. watchfiles exists for --reload, which a shipped
# console never uses, and httptools buys throughput on a listener whose
# bottleneck is a 100 kS/s serial port.
web = [
  # 1.0 is where Starlette's API settled; `<2` is exactly the promise semver
  # already makes, so pinning below the next major costs nothing.
  "starlette>=1.0,<2",
  # 0.50 is the first release whose ws="auto" selects the sans-io websockets
  # implementation rather than the deprecated legacy one.
  "uvicorn>=0.50",
  # Explicit: base uvicorn ships no WebSocket implementation at all, and
  # without one the /ws route answers 404 with only a log line to say why.
  "websockets>=16",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
  "jsonschema>=4.21",
  # The dev environment installs the web extra too. Without it mypy types every
  # Starlette symbol in ppk2lab_web as Any and the server tests would have to
  # skip -- a suite that reports green while proving nothing about half the
  # release.
  "ppk2lab[web]",
  # starlette.testclient needs it; with neither httpx2 nor httpx it raises at
  # import time.
  "httpx2>=2",
]

[project.scripts]
ppk2lab = "ppk2lab.cli.main:entrypoint"

[project.urls]
Homepage = "https://github.com/tipoLi5890/ppk2lab"
Issues = "https://github.com/tipoLi5890/ppk2lab/issues"

[tool.setuptools.dynamic]
version = { attr = "ppk2lab._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
# Explicit rather than "whatever is under src/": a new directory there should
# not join the distribution by being created.
include = ["ppk2lab*", "ppk2lab_web*"]

[tool.setuptools.package-data]
# PEP 561: without this marker beside the installed package, every downstream
# type checker treats the whole ppk2lab surface as Any.
"ppk2lab" = ["py.typed"]
"ppk2lab.schemas" = ["*.json"]
# The built web console, plus the PEP 561 marker the `Typing :: Typed`
# classifier promises for every package in this distribution. The build is
# committed and shipped so that installing from PyPI never requires a Node
# toolchain; `cd webui && npm run build` regenerates it.
#
# The glob is recursive on purpose. A single-level `static/*` silently drops
# anything the bundler decides to put in a subdirectory — a self-hosted font, a
# split chunk — and it drops it with every test still green.
"ppk2lab_web" = ["py.typed", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: real-time tests that stream for seconds (rate checks, stall budgets)",
]
filterwarnings = ["error::DeprecationWarning:ppk2lab.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "SIM108", # ternary rewrites are not always clearer
  "SIM117", # nested with statements are sometimes clearer
]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
mypy_path = "src"
packages = ["ppk2lab", "ppk2lab_web"]
exclude = ["^src/ppk2lab_web/static/"]

[[tool.mypy.overrides]]
module = "serial.*"
ignore_missing_imports = true
